[project]
name = "multimodal-gemini-agent"
version = "0.2.0"
description = "Multimodal AI agent (Gemini + MongoDB Atlas Vector Search) for visual document Q&A"
readme = "PLANNING.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
    "google-generativeai>=0.7.0",
    "pymongo>=4.8.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast offline unit tests with deterministic inputs/mocks",
    "integration: API and end-to-end pipeline tests using offline test doubles",
    "live: tests requiring live GEMINI_API_KEY and MONGODB_URI credentials",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
