[project]
name = "multimodal-gemini-agent"
version = "0.1.0"
description = "Multimodal AI agent (Gemini + MongoDB Atlas Vector Search) for visual document Q&A"
readme = "PLANNING.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "google-generativeai>=0.7.0",
    "pymongo>=4.8.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
